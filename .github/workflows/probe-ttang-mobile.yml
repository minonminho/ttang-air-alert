name: Probe official Ttang mobile pages
on:
  pull_request:
    paths:
      - "crawler/probe-ttang-mobile.mjs"
      - ".github/workflows/probe-ttang-mobile.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node crawler/probe-ttang-mobile.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-ttang-html-probe
          path: crawler/probe-output/
          retention-days: 1
          if-no-files-found: ignore
