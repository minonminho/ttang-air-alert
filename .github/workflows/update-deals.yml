name: Update today's deals

on:
  push:
    paths:
      - ".github/automation-now.trigger"
  workflow_dispatch:
    inputs:
      flight_search_mode:
        description: "Google Flights 검색 범위"
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
  schedule:
    # GitHub Actions uses UTC: 01:00 KST is 16:00 UTC on the previous day.
    - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Asia/Seoul
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.SUPABASE_PROJECT_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      FLIGHT_SEARCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.flight_search_mode || 'quick' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Crawl today's deals
        run: node crawler/update-snapshot.mjs

      - name: Search Google Flights for all 26 cities
        run: node worker/run-all-search.mjs --mode "$FLIGHT_SEARCH_MODE"

      - name: Upload flight search diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-search-diagnostics
          path: worker/data/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare published flight snapshot
        run: cp worker/data/latest-flight-results.json dist/flight-results.json

      - name: Publish snapshots to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/deals.json dist/flight-results.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "chore: publish latest flight snapshots"
          git fetch origin main
          if ! git rebase origin/main; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" = "dist/deals.json"$'\n'"dist/flight-results.json" ] || [ "$conflicts" = "dist/flight-results.json"$'\n'"dist/deals.json" ]; then
              git checkout --theirs dist/deals.json dist/flight-results.json
              git add dist/deals.json dist/flight-results.json
              GIT_EDITOR=true git rebase --continue
            else
              git rebase --abort
              exit 1
            fi
          fi
          git push origin HEAD:main
