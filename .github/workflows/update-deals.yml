name: Update today's deals

on:
  push:
    paths:
      - ".github/automation-now.trigger"
      - ".github/automation-test.trigger"
  workflow_dispatch:
    inputs:
      search_scope:
        description: "test: 도쿄·하코다테·김포 2개 노선 각 3개 일정 / all: 28개 노선"
        required: true
        default: test
        type: choice
        options:
          - test
          - all
      flight_search_mode:
        description: "Google Flights 검색 범위"
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
  schedule:
    # 01:00 KST, daily.
    - cron: "0 16 * * *"

permissions:
  contents: read

concurrency:
  group: update-deals-${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[flight-scope:all]'))) && 'all' || github.event_name == 'workflow_dispatch' && inputs.search_scope || 'test' }}
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  # Use the [flight-scope:all] commit marker to run all 28 routes; other pushes remain test-only.
  SEARCH_SCOPE: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[flight-scope:all]'))) && 'all' || github.event_name == 'workflow_dispatch' && inputs.search_scope || 'test' }}
  FLIGHT_SEARCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.flight_search_mode || 'quick' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      search_date: ${{ steps.plan.outputs.search_date }}
      max_trips: ${{ steps.plan.outputs.max_trips }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Display search scope
        run: echo "Search scope is $SEARCH_SCOPE"
      - id: plan
        run: node worker/search-plan.mjs >> "$GITHUB_OUTPUT"

  search:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore recent search cache
        uses: actions/cache@v4
        with:
          path: worker/data/flight-cache.json
          key: google-v2-${{ runner.os }}-${{ env.SEARCH_SCOPE }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            google-v2-${{ runner.os }}-${{ env.SEARCH_SCOPE }}-${{ matrix.shard }}-
      - run: npx playwright install --with-deps chromium
      - name: Search assigned cities
        timeout-minutes: ${{ env.SEARCH_SCOPE == 'test' && 15 || 300 }}
        env:
          CITIES: ${{ matrix.cities }}
          SEARCH_DATE: ${{ needs.plan.outputs.search_date }}
          MAX_TRIPS: ${{ needs.plan.outputs.max_trips }}
        run: |
          if [ "$SEARCH_SCOPE" = "test" ]; then
            node worker/run-all-search.mjs --mode "$FLIGHT_SEARCH_MODE" --cities "$CITIES" --start-date "$SEARCH_DATE" --max-trips "$MAX_TRIPS" --fresh
          else
            node worker/run-all-search.mjs --mode "$FLIGHT_SEARCH_MODE" --cities "$CITIES" --start-date "$SEARCH_DATE" --max-trips "$MAX_TRIPS"
          fi
      - name: Upload shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-shard-${{ matrix.shard }}
          path: worker/data/latest-flight-results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload search diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-search-diagnostics-${{ matrix.shard }}
          path: worker/data/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [plan, search]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: flight-shard-*
          path: worker/data/shards
      - name: Merge test results (preserve published data)
        if: env.SEARCH_SCOPE == 'test'
        run: node worker/merge-search-results.mjs --test
      - name: Upload test summary
        if: env.SEARCH_SCOPE == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: flight-test-summary
          path: worker/data/test-flight-results.json
          retention-days: 7
      - name: Merge results into published snapshot
        if: env.SEARCH_SCOPE != 'test'
        run: node worker/merge-search-results.mjs
      - name: Install Chromium
        if: env.SEARCH_SCOPE != 'test'
        run: npx playwright install --with-deps chromium
      - name: Crawl today's deals
        if: env.SEARCH_SCOPE != 'test'
        run: node crawler/update-snapshot.mjs
      - name: Publish snapshots to repository
        if: env.SEARCH_SCOPE != 'test'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/deals.json dist/flight-results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: publish latest flight snapshots"
          git fetch origin main
          if ! git rebase origin/main; then
            while IFS= read -r file; do
              case "$file" in
                dist/deals.json|dist/flight-results.json) git checkout --theirs -- "$file"; git add -- "$file" ;;
                *) git rebase --abort; exit 1 ;;
              esac
            done < <(git diff --name-only --diff-filter=U)
            GIT_EDITOR=true git rebase --continue
          fi
          git push origin HEAD:main
      - name: Update lightweight Supabase metadata (non-blocking)
        if: env.SEARCH_SCOPE != 'test'
        continue-on-error: true
        timeout-minutes: 2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: node worker/publish-search-metadata.mjs
