name: Update today's deals

on:
  workflow_dispatch:
    inputs:
      flight_search_mode:
        description: "네이버 항공권 검색 범위"
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
  schedule:
    # GitHub Actions uses UTC: 01:00 KST is 16:00 UTC on the previous day.
    - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FLIGHT_SEARCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.flight_search_mode || 'quick' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Crawl today's deals
        run: node crawler/update-snapshot.mjs

      - name: Search Naver flights for all 26 cities
        run: node worker/run-all-search.mjs --mode "$FLIGHT_SEARCH_MODE"
