name: Test snapshot publishing

on:
  pull_request:
    paths:
      - "worker/**"
      - "package.json"
      - ".github/workflows/update-deals.yml"
      - ".github/workflows/test-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
