name: Test snapshot publishing

on:
  pull_request:
    paths:
      - "worker/**"
      - "crawler/**"
      - "dist/app.js"
      - "dist/fare-insights.js"
      - "dist/fare-insights.css"
      - "dist/price-history.json"
      - "dist/index.html"
      - "dist/styles.css"
      - "package.json"
      - ".github/workflows/update-deals.yml"
      - ".github/workflows/test-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: node --check dist/app.js
      - run: node --check dist/fare-insights.js
      - run: node --check worker/update-price-history.mjs
      - run: node --check crawler/update-snapshot.mjs
